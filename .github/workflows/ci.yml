name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: silverstripe/gha-ci/.github/workflows/ci.yml@v1
    with:
      simple_matrix: true
      composer_require_extra: silvershop/core:dev-main

  # A shop without the optional module must boot too: a class that extends one of its classes would fail on flush.
  standalone:
    name: Without silvershop-suite/api
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer remove --dev silvershop-suite/api --no-interaction --no-progress

      - name: Run PHPUnit
        env:
          SS_ENVIRONMENT_TYPE: dev
          SS_DATABASE_CLASS: SQLite3Database
          SS_DATABASE_NAME: ss_test
          SS_SQLITE_DATABASE_PATH: ":memory:"
        run: vendor/bin/phpunit
